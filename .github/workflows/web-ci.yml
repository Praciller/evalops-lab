name: Web Evidence Console CI

on:
  push:
    paths:
      - "DESIGN.md"
      - "apps/web/**"
      - "docs/screenshots/evidence-console/**"
      - "scripts/generate_public_demo_evidence.py"
      - "src/evalops/export/**"
      - "src/evalops/evaluators/retrieval/**"
      - "src/evalops/regression/**"
      - "src/evalops/models/runs.py"
      - "src/evalops/runners/retrieval.py"
      - "datasets/fixtures/retrieval-ground-truth.jsonl"
      - "datasets/fixtures/retrieval-predictions.jsonl"
      - "datasets/fixtures/retrieval-reference-predictions.jsonl"
      - "docs/specs/public-evidence-contract-v1.md"
      - ".github/workflows/web-ci.yml"
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run storybook:build
      - run: npm run storybook:build:public
      - run: node scripts/verify-public-storybook.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run storybook:test
      - run: npm run build
      - run: npm run test:e2e
