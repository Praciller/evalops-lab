name: Local Workspace CI

on:
  push:
    paths:
      - 'apps/workspace/**'
      - 'packages/evidence-ui/**'
      - 'src/evalops/workspace/**'
      - 'src/evalops/cli.py'
      - 'pyproject.toml'
      - 'tests/workspace/**'
      - 'scripts/export_workspace_openapi.py'
      - 'scripts/run_workspace_e2e_server.py'
      - 'scripts/stage_workspace_assets.py'
      - 'scripts/verify_workspace_wheel.py'
      - 'scripts/verify_workspace_runtime_boundary.py'
      - '.github/workflows/workspace-ci.yml'
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,workspace]'
      - name: Python lint
        run: ruff check .
      - name: Python formatting
        run: ruff format --check .
      - name: Python type check
        run: mypy src
      - name: Full Python tests (including Workspace/API)
        run: pytest
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/workspace/package-lock.json
      - name: Install npm dependencies
        working-directory: apps/workspace
        run: npm ci
      - name: Verify Workspace ESLint and TypeScript peer dependencies
        working-directory: apps/workspace
        run: npm ls eslint typescript --depth=4
      - name: Workspace dependency audit (all)
        working-directory: apps/workspace
        run: npm audit --audit-level=moderate
      - name: Workspace dependency audit (production)
        working-directory: apps/workspace
        run: npm audit --omit=dev --audit-level=moderate
      - name: Workspace lint
        working-directory: apps/workspace
        run: npm run lint
      - name: Workspace type check
        working-directory: apps/workspace
        run: npm run typecheck
      - name: Workspace unit tests
        working-directory: apps/workspace
        run: npm test
      - name: Workspace build
        working-directory: apps/workspace
        run: npm run build
      - name: OpenAPI schema check
        run: python scripts/export_workspace_openapi.py --check
      - name: Stage checked frontend assets into Python package
        run: python scripts/stage_workspace_assets.py
      - name: Build release-candidate wheel without publishing
        run: python -m build --wheel
      - name: Inspect distributable runtime boundaries and exact asset bytes
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -type f -print -quit)
          test -n "$wheel"
          python scripts/verify_workspace_runtime_boundary.py --wheel "$wheel"
          sha256sum "$wheel"
      - name: Validate real wheel files and deterministic SHA-256
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -type f -print -quit)
          test -n "$wheel"
          EVALOPS_WHEEL_PATH="$wheel" python -m pytest tests/workspace/test_package_smoke.py -q
      - name: Install Playwright Chromium
        working-directory: apps/workspace
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E tests
        working-directory: apps/workspace
        run: npm run test:e2e
      - name: Verify fresh wheel installation, loopback runtime, browser flow and restart
        run: |
          wheel=$(find dist -maxdepth 1 -name '*.whl' -type f -print -quit)
          test -n "$wheel"
          python scripts/verify_workspace_wheel.py "$wheel" --browser
