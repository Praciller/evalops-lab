name: Local Workspace CI

on:
  push:
    paths:
      - 'apps/workspace/**'
      - 'packages/evidence-ui/**'
      - 'src/evalops/workspace/**'
      - 'src/evalops/cli.py'
      - 'pyproject.toml'
      - 'tests/workspace/**'
      - 'scripts/export_workspace_openapi.py'
      - 'scripts/run_workspace_e2e_server.py'
      - '.github/workflows/workspace-ci.yml'
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,workspace]'
      - name: Python lint
        run: ruff check src/evalops/workspace tests/workspace scripts/export_workspace_openapi.py scripts/run_workspace_e2e_server.py
      - name: Python type check
        run: mypy src
      - name: Workspace Python tests
        run: pytest tests/workspace
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/workspace/package-lock.json
      - name: Install npm dependencies
        working-directory: apps/workspace
        run: npm ci
      - name: Workspace lint
        working-directory: apps/workspace
        run: npm run lint
      - name: Workspace type check
        working-directory: apps/workspace
        run: npm run typecheck
      - name: Workspace unit tests
        working-directory: apps/workspace
        run: npm test
      - name: Workspace build
        working-directory: apps/workspace
        run: npm run build
      - name: OpenAPI schema check
        run: python scripts/export_workspace_openapi.py --check
      - name: Install Playwright Chromium
        working-directory: apps/workspace
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E tests
        working-directory: apps/workspace
        run: npm run test:e2e
