name: Temporary visual review
on:
  push:
    branches: [fix/pages-navigation-guided-tour]
    paths: [.github/workflows/visual-review-temp.yml]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:pages
      - run: PAGES_MODE=true npx playwright test --update-snapshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pages-visual-review
          path: |
            apps/web/tests/e2e/__screenshots__
            apps/web/test-results
            docs/screenshots/evidence-console
