name: Deploy EvalOps Evidence Console to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "DESIGN.md"
      - "apps/web/**"
      - "datasets/fixtures/miracl-th-mini/**"
      - "datasets/fixtures/retrieval-*.jsonl"
      - "docs/specs/public-evidence-contract-v1.md"
      - "scripts/generate_public_demo_evidence.py"
      - "src/evalops/benchmarks/**"
      - "src/evalops/evaluators/retrieval/**"
      - "src/evalops/export/**"
      - "src/evalops/failures/**"
      - "src/evalops/models/retrieval.py"
      - "src/evalops/runners/retrieval.py"
      - "src/evalops/regression/**"
      - "src/evalops/models/runs.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build and verify Pages-mode browser path
        run: |
          npm run build:pages
          npm run test:e2e:pages
      - name: Verify static output
        run: |
          test -f out/index.html
          test -f out/runs/index.html
          test -f out/runs/demo-retrieval-fixture-v1/index.html
          test -f out/runs/demo-retrieval-reference-v1/index.html
          test -f out/runs/demo-miracl-th-mini-v1/index.html
          test -f out/comparisons/index.html
          test -f out/comparisons/demo-retrieval-regression-v1/index.html
          test -f out/comparisons/demo-retrieval-regression-v1/failures/index.html
          test -f out/storybook/index.html
          test -f out/storybook/index.json
          ! grep -R -n -E 'Internal/|Debug/|\.internal\.stories' out/storybook
          test ! -d out/reports
          test ! -d out/datasets
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/web/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
