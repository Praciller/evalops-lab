[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalops-lab"
version = "0.1.0"
description = "AI reliability testing and evaluation framework for RAG systems, LLM outputs, and AI-generated code."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "EvalOps Lab contributors" }]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]
hhem = [
    "transformers>=4.39.3,<4.40",
    "torch>=2.0,<3",
    "safetensors>=0.4,<1",
    "sentencepiece>=0.1.99,<1",
]

[project.scripts]
evalops = "evalops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(^|/)(tests|scripts)/"

[[tool.mypy.overrides]]
module = ["torch"]
ignore_missing_imports = true
